name: Deploy visualizer

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/visualizer/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsup.config.ts'
      - '.github/workflows/deploy-visualizer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/visualizer/package-lock.json

      - name: Install framework
        run: npm ci

      - name: Build framework
        run: npm run build

      - name: Install visualizer
        run: npm ci --prefix tools/visualizer

      - name: Typecheck visualizer
        run: npm --prefix tools/visualizer run typecheck

      - name: Build visualizer
        run: npm --prefix tools/visualizer run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Check the build kept its IR class names
        run: npm --prefix tools/visualizer run check:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/visualizer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
