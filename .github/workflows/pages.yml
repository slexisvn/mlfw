name: Deploy notebook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  QUERY_ENGINE_REPOSITORY: slexisvn/query_engine
  QUERY_ENGINE_PATH: plugins/query-engine

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mlfw
        uses: actions/checkout@v5

      - name: Checkout query engine plugin
        uses: actions/checkout@v5
        with:
          repository: ${{ env.QUERY_ENGINE_REPOSITORY }}
          path: ${{ env.QUERY_ENGINE_PATH }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install mlfw dependencies
        run: npm ci

      - name: Build query engine plugin
        working-directory: ${{ env.QUERY_ENGINE_PATH }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

          if npm run | grep -qE '^  build$|^    build$| build$'; then
            npm run build
          fi

          if [ -f dist/bundle/browser/query-engine.browser.js ]; then
            cp dist/bundle/browser/query-engine.browser.js query-engine.browser.js
          elif [ -f dist/query-engine.browser.js ]; then
            cp dist/query-engine.browser.js query-engine.browser.js
          fi

          test -f query-engine.browser.js

      - name: Build mlfw browser bundles
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp notebook/index.html _site/
          cp notebook/notebook.css _site/
          mkdir -p _site/chart _site/dist
          cp notebook/chart/chart.css _site/chart/
          cp -R notebook/dist/. _site/dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
